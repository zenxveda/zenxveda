<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400" fill="none">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#0A0F1F"/>
      <stop offset="50%" stop-color="#0C1426"/>
      <stop offset="75%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cyan Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <!-- Purple Accent -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Amber/Gold for milestone -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Border sweep gradient -->
    <linearGradient id="border-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="title-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Subtle dot grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#22D3EE" opacity="0.12"/>
    </pattern>

    <!-- Animated pulse for the status dot -->
    <radialGradient id="pulse-ring" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes pulse { 0%,100%{opacity:0.4;r:6} 50%{opacity:0.8;r:10} }
    @keyframes twinkle { 0%,100%{opacity:0.15} 50%{opacity:0.9} }
    @keyframes sweep { 0%{stroke-dashoffset:3000} 100%{stroke-dashoffset:0} }
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 14px; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-weight: 600; letter-spacing: 2px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; letter-spacing: 5px; }
    .stat-num { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: 1px; }
    .stat-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 500; letter-spacing: 1.5px; }
    .star { animation: twinkle 3s ease-in-out infinite; }
  </style>

  <!-- Deep Space Canvas -->
  <rect x="0" y="0" width="1200" height="400" rx="16" fill="url(#space-bg)"/>
  <rect x="0" y="0" width="1200" height="400" rx="16" fill="url(#dot-grid)"/>

  <!-- Atmospheric Orbs -->
  <circle cx="180" cy="100" r="120" fill="#0E7490" opacity="0.04" filter="url(#orb-glow)"/>
  <circle cx="1020" cy="300" r="100" fill="#7C3AED" opacity="0.035" filter="url(#orb-glow)"/>
  <circle cx="600" cy="200" r="280" fill="#0891B2" opacity="0.025" filter="url(#orb-glow)"/>

  <!-- Star Field -->
  <g>
    <circle cx="82" cy="45" r="1.2" fill="#E2E8F0" class="star" opacity="0.3"/>
    <circle cx="210" cy="28" r="0.8" fill="#22D3EE" class="star" opacity="0.5" style="animation-delay:-0.8s"/>
    <circle cx="345" cy="62" r="1.0" fill="#E2E8F0" class="star" opacity="0.2" style="animation-delay:-1.5s"/>
    <circle cx="480" cy="30" r="1.4" fill="#A5F3FC" class="star" opacity="0.4" style="animation-delay:-2.1s"/>
    <circle cx="620" cy="55" r="0.9" fill="#C4B5FD" class="star" opacity="0.3" style="animation-delay:-0.3s"/>
    <circle cx="750" cy="25" r="1.1" fill="#E2E8F0" class="star" opacity="0.25" style="animation-delay:-1.8s"/>
    <circle cx="880" cy="48" r="1.3" fill="#22D3EE" class="star" opacity="0.35" style="animation-delay:-2.5s"/>
    <circle cx="1020" cy="35" r="0.7" fill="#E2E8F0" class="star" opacity="0.2" style="animation-delay:-0.6s"/>
    <circle cx="1120" cy="60" r="1.0" fill="#A5F3FC" class="star" opacity="0.3" style="animation-delay:-1.2s"/>
    <circle cx="150" cy="340" r="0.9" fill="#C4B5FD" class="star" opacity="0.2" style="animation-delay:-2.0s"/>
    <circle cx="310" cy="360" r="1.1" fill="#E2E8F0" class="star" opacity="0.15" style="animation-delay:-0.4s"/>
    <circle cx="530" cy="375" r="0.8" fill="#22D3EE" class="star" opacity="0.3" style="animation-delay:-1.6s"/>
    <circle cx="720" cy="355" r="1.2" fill="#E2E8F0" class="star" opacity="0.2" style="animation-delay:-2.3s"/>
    <circle cx="900" cy="370" r="0.7" fill="#A5F3FC" class="star" opacity="0.25" style="animation-delay:-0.9s"/>
    <circle cx="1070" cy="350" r="1.0" fill="#C4B5FD" class="star" opacity="0.2" style="animation-delay:-1.3s"/>
  </g>

  <!-- Animated Border Frame -->
  <rect x="4" y="4" width="1192" height="392" rx="14" stroke="url(#border-sweep)" stroke-width="1.5" fill="none" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Top Bar: Status + Platform Tags -->
  <g transform="translate(40, 42)">
    <!-- Live status pill -->
    <rect x="0" y="-12" width="105" height="24" rx="12" fill="#020617" stroke="#164E63" stroke-width="1"/>
    <circle cx="14" cy="0" r="4" fill="#22D3EE" filter="url(#star-glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="4" fill="#22D3EE" font-size="9.5" class="mono">ONLINE</text>

    <!-- Right side: platform tags -->
    <text x="1120" y="4" text-anchor="end" fill="#475569" font-size="10" class="mono">
      BEDROCK <tspan fill="#1E293B">•</tspan> JAVA <tspan fill="#1E293B">•</tspan> GLSL <tspan fill="#1E293B">•</tspan> FABRIC <tspan fill="#1E293B">•</tspan> PBR
    </text>
  </g>

  <!-- Central Hero Title -->
  <g transform="translate(600, 155)">
    <!-- Deep background glow layer -->
    <text x="0" y="0" text-anchor="middle" fill="#0891B2" font-size="84" class="brand-title" opacity="0.35" filter="url(#title-glow)">ZENXVEDA</text>
    <!-- Main crisp title -->
    <text x="0" y="0" text-anchor="middle" fill="url(#title-grad)" font-size="84" class="brand-title" filter="url(#soft-glow)">ZENXVEDA</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="198" text-anchor="middle" fill="#94A3B8" font-size="12.5" class="tagline">
    SHADER ENGINEERING  <tspan fill="#22D3EE" font-size="14">⬥</tspan>  MOD ARCHITECTURE  <tspan fill="#7C3AED" font-size="14">⬥</tspan>  CINEMATIC PRODUCTION
  </text>

  <!-- Milestone Achievement Badge (centered below tagline) -->
  <g transform="translate(600, 240)">
    <rect x="-200" y="-14" width="400" height="28" rx="14" fill="#0F172A" stroke="#7C3AED" stroke-width="1" opacity="0.9"/>
    <!-- Trophy icon (simple star) -->
    <text x="-178" y="4" fill="url(#gold-grad)" font-size="13">★</text>
    <text x="-160" y="4" fill="url(#gold-grad)" font-size="10" class="mono" font-weight="700">CURSEFORGE LEGENDS</text>
    <text x="-18" y="4" fill="#64748B" font-size="10" class="mono">|</text>
    <text x="-4" y="4" fill="#A855F7" font-size="10" class="mono">RISING BUILDER 500K+</text>
  </g>

  <!-- Bottom Stats Bar -->
  <g transform="translate(600, 310)">
    <!-- Bar background -->
    <rect x="-480" y="-22" width="960" height="44" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

    <!-- Stat 1: Downloads -->
    <g transform="translate(-340, 0)">
      <text x="0" y="-4" text-anchor="middle" fill="url(#title-grad)" font-size="18" class="stat-num" filter="url(#star-glow)">940,700+</text>
      <text x="0" y="12" text-anchor="middle" fill="#64748B" font-size="8.5" class="stat-label">TOTAL DOWNLOADS</text>
    </g>

    <!-- Divider -->
    <line x1="-190" y1="-12" x2="-190" y2="12" stroke="#1E293B" stroke-width="1"/>

    <!-- Stat 2: Projects -->
    <g transform="translate(-90, 0)">
      <text x="0" y="-4" text-anchor="middle" fill="url(#purple-grad)" font-size="18" class="stat-num">14+</text>
      <text x="0" y="12" text-anchor="middle" fill="#64748B" font-size="8.5" class="stat-label">PUBLISHED PROJECTS</text>
    </g>

    <!-- Divider -->
    <line x1="30" y1="-12" x2="30" y2="12" stroke="#1E293B" stroke-width="1"/>

    <!-- Stat 3: YouTube -->
    <g transform="translate(150, 0)">
      <text x="0" y="-4" text-anchor="middle" fill="#EF4444" font-size="18" class="stat-num">2,730+</text>
      <text x="0" y="12" text-anchor="middle" fill="#64748B" font-size="8.5" class="stat-label">YOUTUBE SUBSCRIBERS</text>
    </g>

    <!-- Divider -->
    <line x1="280" y1="-12" x2="280" y2="12" stroke="#1E293B" stroke-width="1"/>

    <!-- Stat 4: Videos -->
    <g transform="translate(380, 0)">
      <text x="0" y="-4" text-anchor="middle" fill="#10B981" font-size="18" class="stat-num">255+</text>
      <text x="0" y="12" text-anchor="middle" fill="#64748B" font-size="8.5" class="stat-label">VIDEOS PUBLISHED</text>
    </g>
  </g>

  <!-- Horizontal glow line below title area -->
  <line x1="250" y1="215" x2="950" y2="215" stroke="url(#title-grad)" stroke-width="0.5" opacity="0.25"/>
</svg>
