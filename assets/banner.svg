<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="diamond-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .title-text {
      font-family: 'Courier New', 'JetBrains Mono', 'Segoe UI', monospace;
      font-weight: 900;
      letter-spacing: 6px;
    }
    .pixel-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .floating-item {
      animation: float 4s ease-in-out infinite;
    }
  </style>

  <!-- Deepslate Base Plate -->
  <rect x="8" y="8" width="984" height="244" rx="16" fill="url(#bg-grad)"/>

  <!-- Minecraft GUI Frame / Border -->
  <rect x="8" y="8" width="984" height="244" rx="16" stroke="url(#border-grad)" stroke-width="2.5" fill="none"/>
  <rect x="14" y="14" width="972" height="232" rx="12" stroke="#164E63" stroke-width="1" stroke-dasharray="8 8" fill="none" opacity="0.4"/>

  <!-- Decorative Pixel Pattern Background Grid -->
  <g opacity="0.08" fill="#22D3EE">
    <!-- Row 1 -->
    <rect x="60" y="40" width="8" height="8"/>
    <rect x="180" y="60" width="8" height="8"/>
    <rect x="320" y="35" width="8" height="8"/>
    <rect x="700" y="45" width="8" height="8"/>
    <rect x="860" y="70" width="8" height="8"/>
    <rect x="920" y="35" width="8" height="8"/>
    <!-- Row 2 -->
    <rect x="90" y="180" width="8" height="8"/>
    <rect x="220" y="210" width="8" height="8"/>
    <rect x="400" y="195" width="8" height="8"/>
    <rect x="640" y="215" width="8" height="8"/>
    <rect x="800" y="190" width="8" height="8"/>
    <rect x="900" y="220" width="8" height="8"/>
  </g>

  <!-- Corner Ore Glyphs (Cyan Diamond Ore Pattern) -->
  <g fill="#22D3EE" opacity="0.6">
    <!-- Top Left -->
    <rect x="32" y="32" width="6" height="6"/>
    <rect x="38" y="26" width="6" height="6"/>
    <rect x="44" y="32" width="6" height="6"/>
    <rect x="38" y="38" width="6" height="6"/>
    <!-- Bottom Right -->
    <rect x="956" y="222" width="6" height="6"/>
    <rect x="962" y="216" width="6" height="6"/>
    <rect x="968" y="222" width="6" height="6"/>
    <rect x="962" y="228" width="6" height="6"/>
  </g>

  <!-- Advancement Badge (Top Center) -->
  <g transform="translate(500, 48)">
    <!-- Pill container -->
    <rect x="-190" y="-18" width="380" height="32" rx="16" fill="#0A101F" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Icon: Trophy/Star -->
    <path d="M-170 -6 L-166 6 L-178 -1 L-162 -1 L-174 6 Z" fill="url(#gold-grad)"/>
    <text x="-155" y="3" fill="url(#gold-grad)" font-size="11" class="pixel-text" font-weight="bold">
      ADVANCEMENT: ARCHITECT OF WORLDS
    </text>
  </g>

  <!-- Main Hero Title "ZENXVEDA" -->
  <!-- Subtle Back Glow -->
  <text x="500" y="142" text-anchor="middle" fill="#0891B2" font-size="62" class="title-text" filter="url(#glow)" opacity="0.7">
    ZENXVEDA
  </text>
  <!-- Foreground Title with Diamond Gradient -->
  <text x="500" y="142" text-anchor="middle" fill="url(#diamond-glow)" font-size="62" class="title-text" filter="url(#subtle-glow)">
    ZENXVEDA
  </text>

  <!-- Subtitle Tagline -->
  <text x="500" y="180" text-anchor="middle" fill="#94A3B8" font-size="13" class="pixel-text">
    MINECRAFT MOD ARCHITECT  <tspan fill="#06B6D4">|</tspan>  SHADER ENGINEER  <tspan fill="#06B6D4">|</tspan>  CINEMATIC CREATOR
  </text>

  <!-- XP Bar Style Accent Line at Bottom -->
  <g transform="translate(300, 212)">
    <!-- Background track (Bedrock/Obsidian) -->
    <rect x="0" y="0" width="400" height="6" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <!-- Filled XP track (Diamond Cyan Glow) -->
    <rect x="1" y="1" width="398" height="4" rx="2" fill="url(#diamond-glow)"/>
    <!-- Level Badge in Center -->
    <rect x="180" y="-10" width="40" height="18" rx="4" fill="#0A101F" stroke="#22D3EE" stroke-width="1"/>
    <text x="200" y="3" text-anchor="middle" fill="#55FFFF" font-size="11" class="pixel-text" font-weight="900">
      99
    </text>
  </g>
</svg>
