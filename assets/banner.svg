<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="40%" stop-color="#0A111E"/>
      <stop offset="80%" stop-color="#0D192B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Diamond Cyan Gradient -->
    <linearGradient id="cyan-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <!-- Emerald / Parity Gradient -->
    <linearGradient id="emerald-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="frame-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="30%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="accent-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.4"/>
      <rect x="0" y="0" width="1.5" height="1.5" fill="#22D3EE" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .studio-brand {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 12px;
    }
    .mono-label {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 2.5px;
    }
    .sub-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 4px;
    }
  </style>

  <!-- Canvas Frame -->
  <rect x="6" y="6" width="1188" height="308" rx="20" fill="url(#studio-bg)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="6" y="6" width="1188" height="308" rx="20" fill="url(#pixel-grid)"/>

  <!-- Glowing Radial Accent in Center -->
  <circle cx="600" cy="160" r="240" fill="#0E7490" opacity="0.08" filter="url(#accent-glow)"/>

  <!-- Crisp Studio Border -->
  <rect x="6" y="6" width="1188" height="308" rx="20" stroke="url(#frame-border)" stroke-width="2" fill="none"/>
  
  <!-- Inner Blueprint Framing Lines -->
  <rect x="18" y="18" width="1164" height="284" rx="14" stroke="#164E63" stroke-width="1" stroke-dasharray="6 6" fill="none" opacity="0.35"/>

  <!-- Top Studio Metadata Bar -->
  <g transform="translate(60, 52)">
    <!-- Active Status Pill -->
    <rect x="0" y="-14" width="130" height="24" rx="12" fill="#060B14" stroke="#164E63" stroke-width="1"/>
    <circle cx="16" cy="-2" r="4" fill="#22D3EE"/>
    <text x="28" y="2" fill="#22D3EE" font-size="10" class="mono-label">STUDIO LIVE</text>

    <!-- Version & Focus Tag (Right Aligned in Header) -->
    <text x="1080" y="2" text-anchor="end" fill="#64748B" font-size="11" class="mono-label">
      MINECRAFT // GLSL • FABRIC • BEDROCK PARITY
    </text>
  </g>

  <!-- Primary Studio Identity Title -->
  <g transform="translate(600, 155)">
    <!-- Ambient Shadow / Soft Glow -->
    <text x="0" y="0" text-anchor="middle" fill="#0891B2" font-size="76" class="studio-brand" opacity="0.5" filter="url(#soft-glow)">
      ZENXVEDA
    </text>
    <!-- Crisp Foreground Text with Gradient -->
    <text x="0" y="0" text-anchor="middle" fill="url(#cyan-primary)" font-size="76" class="studio-brand">
      ZENXVEDA
    </text>
  </g>

  <!-- Studio Subtitle -->
  <text x="600" y="198" text-anchor="middle" fill="#94A3B8" font-size="13" class="sub-tagline">
    MOD ARCHITECTURE  <tspan fill="#06B6D4">|</tspan>  SHADER ENGINEERING  <tspan fill="#06B6D4">|</tspan>  CINEMATIC PRODUCTION
  </text>

  <!-- Studio Metrics / Capability Ticker Bar (Bottom) -->
  <g transform="translate(600, 260)">
    <!-- Background Card -->
    <rect x="-380" y="-18" width="760" height="34" rx="17" fill="#060B14" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Capability Ticker Items -->
    <text x="-280" y="4" text-anchor="middle" fill="#CBD5E1" font-size="11" class="mono-label">
      <tspan fill="#22D3EE">◆</tspan> 15+ RELEASES
    </text>
    <text x="-90" y="4" text-anchor="middle" fill="#CBD5E1" font-size="11" class="mono-label">
      <tspan fill="#22D3EE">◆</tspan> VOLUMETRIC GLSL
    </text>
    <text x="100" y="4" text-anchor="middle" fill="#CBD5E1" font-size="11" class="mono-label">
      <tspan fill="#22D3EE">◆</tspan> COMBAT PARITY
    </text>
    <text x="280" y="4" text-anchor="middle" fill="#CBD5E1" font-size="11" class="mono-label">
      <tspan fill="#22D3EE">◆</tspan> 4K CINEMATICS
    </text>
  </g>
</svg>
