<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="100%" height="28" fill="none">
  <defs>
    <linearGradient id="fade-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-5%" y="-80%" width="110%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="80" y1="14" x2="820" y2="14" stroke="url(#fade-line)" stroke-width="1" filter="url(#gl)"/>
  <!-- Center pixel diamond -->
  <rect x="446" y="10" width="8" height="8" rx="1" fill="#7C3AED" opacity="0.5" transform="rotate(45, 450, 14)"/>
  <!-- Side pixel dots -->
  <rect x="248" y="12" width="4" height="4" fill="#22D3EE" opacity="0.25"/>
  <rect x="648" y="12" width="4" height="4" fill="#22D3EE" opacity="0.25"/>
</svg>
