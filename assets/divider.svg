<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="100%" height="40" fill="none">
  <defs>
    <linearGradient id="line-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="65%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="line-glow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Glow line -->
  <line x1="50" y1="20" x2="850" y2="20" stroke="url(#line-cyan)" stroke-width="1.5" filter="url(#line-glow)"/>
  <!-- Center diamond -->
  <g transform="translate(450, 20)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#7C3AED" transform="rotate(45)" opacity="0.8" filter="url(#line-glow)"/>
  </g>
  <!-- Side dots -->
  <circle cx="200" cy="20" r="2" fill="#22D3EE" opacity="0.5"/>
  <circle cx="700" cy="20" r="2" fill="#22D3EE" opacity="0.5"/>
</svg>
