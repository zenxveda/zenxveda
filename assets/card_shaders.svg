<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="280" fill="none">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040916"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#03060E"/>
    </linearGradient>
    <linearGradient id="sh-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#164E63" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="btn-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 800; }
    .body { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 500; }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="456" height="276" rx="8" fill="url(#sh-bg)" stroke="url(#sh-border)" stroke-width="1.5"/>
  <rect x="6" y="6" width="448" height="268" rx="6" stroke="#0E7490" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.3"/>

  <!-- Card Header -->
  <g transform="translate(20, 24)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
    <text x="18" y="24" text-anchor="middle" fill="#22D3EE" font-size="18">🌌</text>
    
    <!-- Title & Domain -->
    <text x="46" y="18" fill="#F8FAFC" font-size="14" class="title">SHADER ENGINEERING</text>
    <text x="46" y="32" fill="#22D3EE" font-size="9.5" class="body">Deferred PBR • Volumetric Fog • Water Caustics</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="74" x2="440" y2="74" stroke="#164E63" stroke-width="1" opacity="0.4"/>

  <!-- Project Rows -->
  <g transform="translate(20, 94)">
    <!-- Row 1: ZenXveda Shaders -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-8" width="6" height="6" fill="#22D3EE"/>
      <text x="14" y="-2" fill="#F8FAFC" font-size="11" class="title">ZenXveda Shaders</text>
      <text x="420" y="-2" text-anchor="end" fill="#22D3EE" font-size="10" class="title">254.2K+</text>
      <text x="14" y="10" fill="#64748B" font-size="9" class="body">Atmospheric True PBR Overhaul for Bedrock</text>
    </g>

    <!-- Row 2: BSL ZenXveda -->
    <g transform="translate(0, 32)">
      <rect x="0" y="-8" width="6" height="6" fill="#0891B2"/>
      <text x="14" y="-2" fill="#F8FAFC" font-size="11" class="title">BSL ZenXveda Shaders</text>
      <text x="420" y="-2" text-anchor="end" fill="#0891B2" font-size="10" class="title">85.1K+</text>
      <text x="14" y="10" fill="#64748B" font-size="9" class="body">Deferred Pipeline with Warm Color Grading</text>
    </g>

    <!-- Row 3: Glowing Ores Pro -->
    <g transform="translate(0, 64)">
      <rect x="0" y="-8" width="6" height="6" fill="#06B6D4"/>
      <text x="14" y="-2" fill="#F8FAFC" font-size="11" class="title">Glowing Ores Pro</text>
      <text x="420" y="-2" text-anchor="end" fill="#06B6D4" font-size="10" class="title">61.7K+</text>
      <text x="14" y="10" fill="#64748B" font-size="9" class="body">High-Contrast Emissive Mining Texture Utility</text>
    </g>

    <!-- Row 4: Vanilla+ Shaders -->
    <g transform="translate(0, 96)">
      <rect x="0" y="-8" width="6" height="6" fill="#10B981"/>
      <text x="14" y="-2" fill="#F8FAFC" font-size="11" class="title">ZenXveda Vanilla+ Shaders</text>
      <text x="420" y="-2" text-anchor="end" fill="#10B981" font-size="10" class="title">22.5K+</text>
      <text x="14" y="10" fill="#64748B" font-size="9" class="body">Lightweight 3D Depth Pipeline at Solid 60 FPS</text>
    </g>
  </g>

  <!-- Bottom CTA Button (Minecraft GUI Style) -->
  <g transform="translate(20, 234)">
    <rect x="0" y="0" width="420" height="28" rx="4" fill="#0A1628" stroke="#164E63" stroke-width="1"/>
    <rect x="2" y="2" width="416" height="24" rx="3" fill="#060F1E" stroke="#1E293B" stroke-width="0.8"/>
    <text x="210" y="17" text-anchor="middle" fill="#22D3EE" font-size="10" class="title">
      VIEW ALL SHADERPACKS IN REPO / CURSEFORGE →
    </text>
  </g>
</svg>
