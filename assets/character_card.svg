<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" width="100%" height="270" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#03060E"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Purple Glow -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Bevel Border -->
    <linearGradient id="card-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Pixel grid pattern -->
    <pattern id="card-dither" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#22D3EE" opacity="0.05"/>
    </pattern>
  </defs>

  <style>
    .pixel-title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 800; letter-spacing: 2px; }
    .pixel-body { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 500; letter-spacing: 0.5px; }
    .pixel-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Deepslate Inventory Panel -->
  <rect x="2" y="2" width="976" height="266" rx="8" fill="url(#card-bg)"/>
  <rect x="2" y="2" width="976" height="266" rx="8" fill="url(#card-dither)"/>
  
  <!-- Inset Minecraft Border -->
  <rect x="2" y="2" width="976" height="266" rx="8" stroke="url(#card-bevel)" stroke-width="1.5" fill="none"/>
  <rect x="6" y="6" width="968" height="258" rx="6" stroke="#164E63" stroke-width="1" stroke-dasharray="6 4" fill="none" opacity="0.4"/>

  <!-- ═════════════════════════════════════════════════════════ -->
  <!-- LEFT COLUMN: PLAYER AVATAR & HUD                          -->
  <!-- ═════════════════════════════════════════════════════════ -->
  <g transform="translate(24, 22)">
    <!-- Avatar Frame (Inventory Slot) -->
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#0A1224" stroke="#0891B2" stroke-width="1.5"/>
    <rect x="4" y="4" width="92" height="92" rx="4" fill="#030712" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Pixel Art Helmet Silhouette with Cyan Glowing Visor -->
    <g transform="translate(50, 48)">
      <!-- Helmet Dome -->
      <rect x="-24" y="-30" width="48" height="34" rx="2" fill="#0E7490"/>
      <rect x="-20" y="-34" width="40" height="8" rx="2" fill="#22D3EE" opacity="0.8"/>
      <!-- Helmet Cheek Guards -->
      <rect x="-24" y="4" width="12" height="22" fill="#0891B2"/>
      <rect x="12" y="4" width="12" height="22" fill="#0891B2"/>
      <rect x="-12" y="20" width="24" height="6" fill="#06B6D4"/>
      <!-- Glowing Cyan Visor -->
      <rect x="-16" y="-6" width="32" height="10" rx="1" fill="#22D3EE" filter="url(#soft-glow)"/>
      <rect x="-12" y="-4" width="10" height="6" fill="#FFFFFF"/>
      <rect x="2" y="-4" width="10" height="6" fill="#FFFFFF"/>
    </g>

    <!-- Level 99 Badge (Corner of Avatar) -->
    <rect x="62" y="78" width="36" height="18" rx="3" fill="#060B18" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="80" y="91" text-anchor="middle" fill="#22D3EE" font-size="10" class="pixel-label">LV.99</text>

    <!-- IGN & Title -->
    <text x="50" y="122" text-anchor="middle" fill="#F8FAFC" font-size="14" class="pixel-title">ZENXVEDA</text>
    <text x="50" y="136" text-anchor="middle" fill="#67E8F9" font-size="9" class="pixel-body">MOD ARCHITECT</text>

    <!-- Pixel Health Hearts (10 Hearts in 2 rows of 5) -->
    <g transform="translate(0, 154)">
      <!-- Row 1 (5 Hearts) -->
      <g fill="#EF4444">
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(2,0)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(22,0)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(42,0)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(62,0)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(82,0)"/>
      </g>
      <!-- Row 2 (5 Hearts) -->
      <g fill="#EF4444">
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(2,12)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(22,12)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(42,12)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(62,12)"/>
        <path d="M6 3 A2 2 0 0 0 2 5 A3 3 0 0 0 6 9 A3 3 0 0 0 10 5 A2 2 0 0 0 6 3 Z" transform="translate(82,12)"/>
      </g>
    </g>

    <!-- Armor Bar (Diamond Defense) -->
    <g transform="translate(0, 192)" fill="#22D3EE">
      <rect x="4" y="0" width="14" height="14" rx="2" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
      <rect x="24" y="0" width="14" height="14" rx="2" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
      <rect x="44" y="0" width="14" height="14" rx="2" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
      <rect x="64" y="0" width="14" height="14" rx="2" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
      <rect x="84" y="0" width="14" height="14" rx="2" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
      <text x="50" y="24" text-anchor="middle" fill="#64748B" font-size="8.5" class="pixel-body">DEFENSE: MAX (100%)</text>
    </g>
  </g>

  <!-- Divider Line 1 -->
  <line x1="150" y1="20" x2="150" y2="250" stroke="#164E63" stroke-width="1" opacity="0.4"/>

  <!-- ═════════════════════════════════════════════════════════ -->
  <!-- CENTER COLUMN: ATTRIBUTES & CODEX                         -->
  <!-- ═════════════════════════════════════════════════════════ -->
  <g transform="translate(176, 36)">
    <!-- Section Header -->
    <rect x="0" y="0" width="370" height="22" rx="4" fill="#0A1224" stroke="#164E63" stroke-width="1"/>
    <text x="12" y="15" fill="#22D3EE" font-size="10.5" class="pixel-label">◈ CHARACTER CODEX // IDENTITY</text>

    <!-- Attribute List -->
    <g transform="translate(0, 42)">
      <!-- Row 1 -->
      <text x="0" y="0" fill="#64748B" font-size="11" class="pixel-label">GUILD:</text>
      <text x="110" y="0" fill="#F8FAFC" font-size="11" class="pixel-body">ZenXveda Studio (Independent)</text>

      <!-- Row 2 -->
      <text x="0" y="24" fill="#64748B" font-size="11" class="pixel-label">SPECIALTY:</text>
      <text x="110" y="24" fill="#67E8F9" font-size="11" class="pixel-body">Volumetric GLSL &amp; Bedrock Parity</text>

      <!-- Row 3 -->
      <text x="0" y="48" fill="#64748B" font-size="11" class="pixel-label">PHILOSOPHY:</text>
      <text x="110" y="48" fill="#F8FAFC" font-size="11" class="pixel-body">Visual Fidelity × 60 FPS Stability</text>

      <!-- Row 4 -->
      <text x="0" y="72" fill="#64748B" font-size="11" class="pixel-label">COMMUNITY:</text>
      <text x="110" y="72" fill="#22D3EE" font-size="11" class="pixel-body">940,000+ Players Worldwide</text>

      <!-- Row 5 -->
      <text x="0" y="96" fill="#64748B" font-size="11" class="pixel-label">ACHIEVEMENT:</text>
      <text x="110" y="96" fill="#F59E0B" font-size="11" class="pixel-body">CurseForge Legends (500K+ Tier)</text>

      <!-- Row 6 -->
      <text x="0" y="120" fill="#64748B" font-size="11" class="pixel-label">PRODUCTION:</text>
      <text x="110" y="120" fill="#C084FC" font-size="11" class="pixel-body">255+ In-Engine 4K Films</text>

      <!-- Row 7 -->
      <text x="0" y="144" fill="#64748B" font-size="11" class="pixel-label">PRIMARY REALM:</text>
      <text x="110" y="144" fill="#10B981" font-size="11" class="pixel-body">Minecraft (Java &amp; Bedrock)</text>
    </g>
  </g>

  <!-- Divider Line 2 -->
  <line x1="576" y1="20" x2="576" y2="250" stroke="#164E63" stroke-width="1" opacity="0.4"/>

  <!-- ═════════════════════════════════════════════════════════ -->
  <!-- RIGHT COLUMN: SKILL LEVEL PROGRESS GAUGES                 -->
  <!-- ═════════════════════════════════════════════════════════ -->
  <g transform="translate(602, 36)">
    <!-- Section Header -->
    <rect x="0" y="0" width="354" height="22" rx="4" fill="#0A1224" stroke="#164E63" stroke-width="1"/>
    <text x="12" y="15" fill="#A855F7" font-size="10.5" class="pixel-label">⚡ SKILL PROFICIENCY GAUGES</text>

    <!-- Gauge 1: GLSL & PBR Shaders -->
    <g transform="translate(0, 42)">
      <text x="0" y="0" fill="#F8FAFC" font-size="10.5" class="pixel-label">GLSL &amp; DEFERRED PBR</text>
      <text x="354" y="0" text-anchor="end" fill="#22D3EE" font-size="10.5" class="pixel-title">98%</text>
      <!-- Track -->
      <rect x="0" y="6" width="354" height="10" rx="2" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <rect x="2" y="8" width="344" height="6" rx="1" fill="url(#cyan-glow)"/>
    </g>

    <!-- Gauge 2: Game Systems & Parity -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" fill="#F8FAFC" font-size="10.5" class="pixel-label">SYSTEMS PARITY &amp; FABRIC</text>
      <text x="354" y="0" text-anchor="end" fill="#A855F7" font-size="10.5" class="pixel-title">92%</text>
      <!-- Track -->
      <rect x="0" y="6" width="354" height="10" rx="2" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <rect x="2" y="8" width="324" height="6" rx="1" fill="url(#purple-glow)"/>
    </g>

    <!-- Gauge 3: Full-Stack & Web -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#F8FAFC" font-size="10.5" class="pixel-label">WEB &amp; SYSTEM INFRASTRUCTURE</text>
      <text x="354" y="0" text-anchor="end" fill="#06B6D4" font-size="10.5" class="pixel-title">85%</text>
      <!-- Track -->
      <rect x="0" y="6" width="354" height="10" rx="2" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <rect x="2" y="8" width="298" height="6" rx="1" fill="#0891B2"/>
    </g>

    <!-- Gauge 4: 4K Cinematics & Media -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" fill="#F8FAFC" font-size="10.5" class="pixel-label">4K CINEMATICS &amp; 3D ASSETS</text>
      <text x="354" y="0" text-anchor="end" fill="#F59E0B" font-size="10.5" class="pixel-title">80%</text>
      <!-- Track -->
      <rect x="0" y="6" width="354" height="10" rx="2" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <rect x="2" y="8" width="280" height="6" rx="1" fill="#D97706"/>
    </g>
  </g>
</svg>
